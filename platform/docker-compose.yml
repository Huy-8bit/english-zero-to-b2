# English Mastery — chạy toàn bộ: docker compose up -d --build  →  http://localhost:8080
name: english-mastery

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CONTENT_ROOT: /content
      DATABASE_URL: sqlite:////data/english.db
      MEDIA_DIR: /data/media
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      # Ngày học được tính theo giờ địa phương (không phải UTC), để một buổi học buổi sáng không bị tính vào hôm trước
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      # Giáo trình Markdown (thư mục cha của platform/), chỉ đọc. Sửa Markdown → web tự cập nhật.
      - ..:/content:ro
      # Dữ liệu học (SQLite) giữ qua các lần khởi động lại
      - learning-data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  learning-data:
    # Keep the existing volume even when the checkout/project directory changes.
    name: ${LEARNING_DATA_VOLUME:-english-mastery_learning-data}
